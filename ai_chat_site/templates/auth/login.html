{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="leaf lg"></span>
    <h5>欢迎回来</h5>
    <div class="sub">登录后继续你的对话</div>
    <form method="post" action="/auth/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">用户名 / 邮箱</label>
        <input class="form-control" name="identifier" autocomplete="username" required autofocus />
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required />
      </div>
      {% if turnstile_site_key %}
      <div class="mb-3"><div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div></div>
      {% endif %}
      <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="remember" name="remember" />
        <label class="form-check-label small" for="remember">保持登录</label>
      </div>
      <button class="btn btn-accent w-100" type="submit">登录</button>
    </form>
    <div class="mt-3 small text-center" style="color: var(--muted)">还没有账号？<a href="/auth/register">用邀请码注册</a></div>
  </div>
</div>
{% endblock %}

{% block head %}
  {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {% endif %}
{% endblock %}
