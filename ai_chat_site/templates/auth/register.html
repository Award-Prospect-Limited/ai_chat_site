{% extends "base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="leaf lg"></span>
    <h5>创建账号</h5>
    <div class="sub">需要管理员提供的邀请码</div>
    <form method="post" action="/auth/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">用户名（3-32 位，字母 / 数字 / 下划线）</label>
        <input class="form-control" name="username" autocomplete="username" required />
      </div>
      <div class="mb-3">
        <label class="form-label">邮箱</label>
        <input class="form-control" type="email" name="email" autocomplete="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">邀请码</label>
        <input class="form-control mono" name="invite_code" autocomplete="off" placeholder="INV-XXXXXXXXXXXXXXXX" required />
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">密码（≥10 位）</label>
          <input class="form-control" type="password" name="password" autocomplete="new-password" required />
        </div>
        <div class="col-6">
          <label class="form-label">确认密码</label>
          <input class="form-control" type="password" name="password2" autocomplete="new-password" required />
        </div>
      </div>
      {% if turnstile_site_key %}
      <div class="mb-3"><div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div></div>
      {% endif %}
      <button class="btn btn-accent w-100" type="submit">创建账号</button>
    </form>
    <div class="mt-3 small text-center" style="color: var(--muted)">已有账号？<a href="/auth/login">登录</a></div>
  </div>
</div>
{% endblock %}

{% block head %}
  {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {% endif %}
{% endblock %}
