# netcup 上 /opt/ai_chat_site/compose.yml 的样板（release-gate"按版本号跑镜像"）。
# 镜像在开单123 构建、扫描后传到服务器；跑哪一版由同目录 .env（权限 600）里的 APP_TAG 决定，
# 只由 /usr/local/sbin/release 改。服务器上不再 git pull、不再现场 docker build。
#
# 目录约定：/opt/ai_chat_site/ 下放 compose.yml、.env、release.json、.release-history、data/（SQLite 和上传文件）。
# 环境变量和原来的 docker-compose.yml 一字不差，只把 build 换成 image，并加了三项容器加固。
name: ai_chat_site

services:
  ai-chat-site:
    image: ai-chat-site:${APP_TAG:?先在 .env 里写 APP_TAG}
    container_name: ai_chat_site
    restart: always
    ports:
      - "127.0.0.1:49193:49193"
    environment:
      - TZ=Asia/Shanghai
      - PORT=49193
      - AI_CHAT_SITE_SECRET_KEY=${AI_CHAT_SITE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_ALLOWED_MODELS=${GEMINI_ALLOWED_MODELS:-}
      - AI_CHAT_SITE_ALLOWED_HOSTS=${AI_CHAT_SITE_ALLOWED_HOSTS}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-1}
      - FORCE_HTTPS=${FORCE_HTTPS:-1}
      - DATABASE_PATH=${DATABASE_PATH:-/data/ai_chat_site.sqlite3}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - MEMORY_ENABLED_DEFAULT=${MEMORY_ENABLED_DEFAULT:-1}
      - MEMORY_EMBED_MODEL=${MEMORY_EMBED_MODEL:-gemini-embedding-001}
      - MEMORY_TOP_K=${MEMORY_TOP_K:-5}
      - MEMORY_MAX_ITEMS=${MEMORY_MAX_ITEMS:-2000}
      - LOCKOUT_MAX_FAILS=${LOCKOUT_MAX_FAILS:-8}
      - LOCKOUT_WINDOW_SECONDS=${LOCKOUT_WINDOW_SECONDS:-900}
      - LOCKOUT_SECONDS=${LOCKOUT_SECONDS:-1800}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-}
    volumes:
      - ./data:/data:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
